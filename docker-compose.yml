services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  ticket-pipeline:
    build:
      context: .
      dockerfile: dockerfile
      target: runtime
    container_name: ticket-pipeline
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: true
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/tickets/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - mongodb

volumes:
  mongodb_data:

networks:
  default:
    name: ticket-network